name: Release

# A push mirror from Forgejo copies tags, not releases. HACS needs a GitHub release,
# so create it from the tag, with the matching CHANGELOG section as notes.
# If the tag push did not start this workflow, run it by hand with the tag name.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.5.2"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches manifest version
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/findus_opac/manifest.json'))['version'])")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != manifest v$v"; exit 1; }
      - name: Extract release notes
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $v"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
